<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proc jsem nedrzel hubu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

  #img {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #mute-btn {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  #mute-btn:hover { opacity: 1; }

  #mute-btn svg { display: block; width: 32px; height: 32px; fill: #fff; }
</style>
</head>
<body>

<img id="img" src="image.gif" alt="">

<button id="mute-btn" title="Mute / Unmute">
  <svg id="icon-sound" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77 0-4.28-2.99-7.86-7-8.77z"/>
  </svg>
  <svg id="icon-mute" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none">
    <path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
  </svg>
</button>

<audio id="audio" src="song.mp3" loop autoplay></audio>

<script>
  const audio = document.getElementById('audio');
  const btn = document.getElementById('mute-btn');
  const iconSound = document.getElementById('icon-sound');
  const iconMute = document.getElementById('icon-mute');

  function updateIcon() {
    if (audio.muted) {
      iconSound.style.display = 'none';
      iconMute.style.display = 'block';
    } else {
      iconSound.style.display = 'block';
      iconMute.style.display = 'none';
    }
  }

  btn.addEventListener('click', () => {
    audio.muted = !audio.muted;
    updateIcon();
  });

  // Browsers block autoplay until user interaction — resume on first click anywhere
  document.addEventListener('click', () => { audio.play().catch(() => {}); }, { once: true });
  audio.play().catch(() => {});
</script>

</body>
</html>
